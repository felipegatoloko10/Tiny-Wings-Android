<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tiny Wings - Clone Android & Web</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4fc3f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 20px;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      font-weight: 800;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
      font-size: 1.2rem;
    }
    .fever-meter {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1.1rem;
      color: #ffd700;
    }
    .sun-bar-container {
      width: 140px;
      height: 14px;
      background: rgba(0,0,0,0.4);
      border-radius: 7px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.7);
    }
    .sun-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ff9800, #ffeb3b);
      transition: width 0.2s linear;
    }
    #start-screen, #game-over-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.65);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      pointer-events: auto;
      text-align: center;
      padding: 20px;
    }
    .game-title {
      font-size: 2.8rem;
      font-weight: 900;
      color: #ffeb3b;
      text-shadow: 0 4px 10px rgba(0,0,0,0.8);
      margin-bottom: 12px;
      letter-spacing: -1px;
    }
    .instructions {
      font-size: 1.1rem;
      margin-bottom: 24px;
      max-width: 400px;
      line-height: 1.5;
      color: #e0e0e0;
    }
    .btn-play {
      background: #ff9800;
      color: #fff;
      border: none;
      padding: 16px 36px;
      font-size: 1.3rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(255,152,0,0.5);
      transition: transform 0.1s;
    }
    .btn-play:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div id="ui-overlay">
    <div class="hud-top">
      <div>Ilha: <span id="hud-island">1</span></div>
      <div class="fever-meter" id="hud-fever">FEVER: x1</div>
      <div>Pontos: <span id="hud-score">0</span></div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span>☀️</span>
        <div class="sun-bar-container">
          <div class="sun-bar-fill" id="sun-bar"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="start-screen">
    <h1 class="game-title">Tiny Wings</h1>
    <p class="instructions">
      Toque e segure na tela para <b>mergulhar nas descidas</b> e solte nas subidas para <b>voar alto</b> antes do sol se pôr!
    </p>
    <button class="btn-play" id="btn-start">JOGAR AGORA</button>
  </div>

  <div id="game-over-screen" style="display: none;">
    <h1 class="game-title">Anoiteceu! 🌙</h1>
    <p class="instructions" id="final-stats">Você chegou à Ilha 1 com 0 pontos!</p>
    <button class="btn-play" id="btn-restart">JOGAR NOVAMENTE</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
