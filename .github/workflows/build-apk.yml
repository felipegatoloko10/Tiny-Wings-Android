name: Build Android APK & Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Gradle Wrapper
      run: |
        cd android
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: Build APK with Gradle
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TinyWings-debug.apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Commit APK to Repository
      run: |
        mkdir -p release
        cp android/app/build/outputs/apk/debug/app-debug.apk release/TinyWings.apk
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add release/TinyWings.apk
        git commit -m "chore(release): upload compiled TinyWings.apk binary [skip ci]" || echo "No changes to commit"
        git push origin main
